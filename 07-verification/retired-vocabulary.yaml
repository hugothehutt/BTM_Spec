# Retired vocabulary — the losing side of every §2 ruling.
#
# `00-overview/04-glossary.md` §2 rules one meaning per word. Each ruling leaves
# a losing spelling behind, and this file is what stops it growing back.
# `07-verification/check_glossary.py` check (d) fails the build on any occurrence
# outside an allowance below.
#
# An allowance is a decision, not a suppression: it carries a written reason, and
# the reason must be that the retired word is load-bearing at that site — a
# regulatory primitive, a quotation, or a sentence whose job is to say the word
# is retired. "It is everywhere and hard to change" is not a reason; that is the
# propagation ticket's work, not an allowance.

retired:

  # --- Q10. `frame` is the sign frame and nothing else -----------------------
  # `00-overview/02-conventions.md` §1 owns the word; INV-G-02 encodes the five
  # frame tokens mechanically. L1's storage artefact took the same word first.
  "FrameSpecHash":
    replacement: SlabSpecHash
    allowed: []
  "frameContentHash":
    replacement: slabContentHash
    allowed: []
  "frame family":
    replacement: slab family
    allowed: []
  "frame set":
    replacement: slab set
    allowed: []
  "warm frame":
    replacement: slab
    allowed: []

  # --- Q11. `gate` is a market commit point S0-S5 and nothing else -----------
  # TN-02 §2 made Gate normative. Process checkpoints took the same word in five
  # further places.
  "release gate":
    replacement: release checkpoint
    allowed: []
  "merge gate":
    replacement: merge checkpoint
    allowed: []
  "CI gate":
    replacement: CI checkpoint
    allowed: []
  "analytic gate":
    replacement: analytic precondition
    allowed: []
  "milestone gate":
    replacement: milestone
    allowed: []

  # --- Q12. `tier` is the co-optimiser ladder and nothing else ---------------
  # Storage tiers and the research/production split took the same word.
  # The §19(2) tariff tier is a regulatory primitive and keeps its name, always
  # written "tariff tier".
  "cold tier":
    replacement: cold store
    allowed: []
  "warm tier":
    replacement: warm store
    allowed: []
  "hot tier":
    replacement: hot store
    allowed: []
  "storage tier":
    replacement: store
    allowed: []

  # --- Q13. `oracle` is the testing term of art ------------------------------
  # T2's "oracle problem" is a term we do not own and cannot redefine. T5's
  # Tier-1 reference gives the word up; `T5` §2 already calls the same object
  # the accuracy reference.
  "oracle":
    replacement: accuracy reference
    allowed:
      - path: 04-compliance/T2-property-and-metamorphic-tests.md
        reason: the oracle problem, the sense the repo keeps
  "ORACLE_BUDGET":
    replacement: REFERENCE_BUDGET
    allowed: []
  "ORACLE_GAP_TOL":
    replacement: REFERENCE_GAP_TOL
    allowed: []

  # --- Q15. `primitive` is the regulatory primitive and nothing else ---------
  # PROTOCOL §1 makes the regulatory primitive load-bearing and it cannot move.
  # The C2 term shapes give the word up; `L2` §1 and ADR-008 already say shapes.
  "linearizable primitives":
    replacement: term shapes
    allowed: []
  "linearizable economic primitives":
    replacement: term shapes
    allowed: []
  "economic primitives":
    replacement: term shapes
    allowed: []
  "linearizable primitive":
    replacement: term shape
    allowed: []

  # --- Q16. `stage` is a measurability level and nothing else ----------------
  # TN-02 §2 reserved it. Two further senses survived the repair: the composer's
  # ordered steps and the settlement timeline.
  "composer stage":
    replacement: composition step
    allowed: []
  "composition stage":
    replacement: composition step
    allowed: []
  "staged market gates":
    replacement: gates
    allowed: []
  "staging table":
    replacement: gate table
    allowed:
      - path: 06-theory/TN-02-fan-not-tree.md
        reason: names the old table in the sentence that renames it

  # --- Named quantities whose name misleads ---------------------------------
  # `peak_to_go` means the peak already realised this period, and reads as the
  # peak remaining. The field it names already exists.
  "peak_to_go":
    replacement: pPoiRealisedPeakMw
    allowed: []

  # --- Already banned in prose, now enforced --------------------------------
  # TN-02 §5 rejected the industry metric and the word for our own.
  "capture rate":
    replacement: PolicyQuality
    allowed:
      - path: 04-compliance/T5-gap-and-performance.md
        reason: names the rejected metric in order to reject it
      - path: 06-theory/TN-02-fan-not-tree.md
        reason: names the rejected metric in order to reject it
